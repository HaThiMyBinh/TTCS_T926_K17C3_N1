<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chấm Công Thực Tập Sinh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { margin-bottom: 15px; color: #2c3e50; }
    
    /* Đồng hồ & Trạng thái */
    .clock-box { text-align: center; padding: 15px; background: #eef2f5; border-radius: 8px; margin-bottom: 20px; }
    .clock-time { font-size: 32px; font-weight: bold; color: #007bff; }
    .clock-date { font-size: 14px; color: #6c757d; }
    
    /* Nút bấm Check-in / Check-out */
    .btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 15px; }
    .btn { padding: 12px 28px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn-checkin { background-color: #28a745; color: white; }
    .btn-checkin:hover:not(:disabled) { background-color: #218838; }
    .btn-checkout { background-color: #dc3545; color: white; }
    .btn-checkout:hover:not(:disabled) { background-color: #c82333; }
    .btn:disabled { background-color: #6c757d; opacity: 0.65; cursor: not-allowed; }
    
    /* Thông báo / Alert (Trạng thái Báo lỗi / Thành công) */
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 15px; display: none; font-size: 14px; }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

    /* Bảng lịch sử */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e9ecef; }
    th { background-color: #f8f9fa; color: #495057; font-weight: 600; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-late { background-color: #ffc107; color: #212529; }
    .badge-early { background-color: #fd7e14; color: white; }
    .badge-normal { background-color: #28a745; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Khung Chấm công Hôm Nay -->
    <div class="card">
      <h2>⏰ Chấm Công Hôm Nay</h2>
      
      <div class="clock-box">
        <div class="clock-time" id="digital-clock">00:00:00</div>
        <div class="clock-date" id="digital-date">Đang tải ngày...</div>
      </div>

      <!-- Khung hiển thị thông báo lỗi / thành công (Task 6.6) -->
      <div id="alert-message" class="alert"></div>

      <!-- Nút Check-in / Check-out với Trạng thái Nút & Loading (Task 6.6) -->
      <div class="btn-group">
        <button id="btn-checkin" class="btn btn-checkin" onclick="handleCheckIn()">
          Check-in (Vào ca)
        </button>
        <button id="btn-checkout" class="btn btn-checkout" onclick="handleCheckOut()" disabled>
          Check-out (Tan ca)
        </button>
      </div>

      <p id="today-status-text" style="text-align: center; color: #6c757d; font-size: 14px;">
        ⏳ Đang kiểm tra trạng thái chấm công hôm nay...
      </p>
    </div>

    <!-- Bảng Lịch Sử Chấm Công (Task 6.6) -->
    <div class="card">
      <h2>📋 Lịch Sử Chấm Công</h2>
      <div id="history-container">
        <table>
          <thead>
            <tr>
              <th>Ngày</th>
              <th>Giờ Check-in</th>
              <th>Giờ Check-out</th>
              <th>Thời gian làm (phút)</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <tr>
              <td colspan="5" style="text-align: center; color: #6c757d;">⏳ Đang tải lịch sử...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    const getToken = () => localStorage.getItem('token') || '';

    // ==========================================
    // 1. ĐỒNG HỒ THỜI GIAN THỰC (Task 6.5)
    // ==========================================
    function updateClock() {
      const now = new Date();
      document.getElementById('digital-clock').innerText = now.toLocaleTimeString('vi-VN');
      document.getElementById('digital-date').innerText = now.toLocaleDateString('vi-VN', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // 2. HIỂN THỊ THÔNG BÁO LỖI / THÀNH CÔNG (Task 6.6)
    // ==========================================
    function showAlert(message, type = 'danger') {
      const alertBox = document.getElementById('alert-message');
      alertBox.className = `alert alert-${type}`;
      alertBox.innerText = message;
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
    }

    // ==========================================
    // 3. TẢI TRẠNG THÁI HÔM NAY (GET /api/attendance/today - Task 6.4 & 6.6)
    // ==========================================
    async function loadTodayStatus() {
      const btnCheckIn = document.getElementById('btn-checkin');
      const btnCheckOut = document.getElementById('btn-checkout');
      const statusText = document.getElementById('today-status-text');

      try {
        const response = await fetch(`${API_BASE}/attendance/today`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });

        if (response.status === 401) {
          showAlert('🔒 Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại.', 'danger');
          statusText.innerText = 'Chưa đăng nhập';
          return;
        }

        if (!response.ok) {
          statusText.innerText = 'Không thể tải trạng thái chấm công.';
          return;
        }

        const data = await response.json();

        // Xử lý Trạng thái Nút (Task 6.6)
        if (!data || !data.check_in_time) {
          // Chưa Check-in -> Bật nút Check-in, Tắt nút Check-out
          btnCheckIn.disabled = false;
          btnCheckOut.disabled = true;
          statusText.innerText = '💡 Bạn chưa check-in hôm nay.';
        } else if (data.check_in_time && !data.check_out_time) {
          // Đã Check-in, Chưa Check-out -> Tắt nút Check-in, Bật nút Check-out
          btnCheckIn.disabled = true;
          btnCheckOut.disabled = false;
          statusText.innerText = `✅ Đã check-in lúc: ${data.check_in_time}`;
        } else {
          // Đã Check-out -> Tắt cả 2 nút
          btnCheckIn.disabled = true;
          btnCheckOut.disabled = true;
          statusText.innerText = `🎉 Đã hoàn tất chấm công hôm nay (Vào: ${data.check_in_time} - Ra: ${data.check_out_time})`;
        }
      } catch (error) {
        statusText.innerText = 'Lỗi kết nối máy chủ.';
        showAlert('⚠️ Không thể kết nối tới Server (Lỗi 500)', 'danger');
      }
    }

    // ==========================================
    // 4. XỬ LÝ CHECK-IN (POST /api/attendance/check-in - Task 6.2 & 6.6)
    // ==========================================
    async function handleCheckIn() {
      const btnCheckIn = document.getElementById('btn-checkin');
      
      // Trạng thái Loading (Task 6.6)
      btnCheckIn.disabled = true;
      btnCheckIn.innerText = '⏳ Đang xử lý...';

      try {
        const response = await fetch(`${API_BASE}/attendance/check-in`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`
          }
        });

        const resData = await response.json();

        if (response.status === 409) {
          showAlert('⚠️ Bạn đã check-in hôm nay rồi! (Lỗi 409)', 'warning');
        } else if (response.status === 401 || response.status === 403) {
          showAlert('🔒 Không có quyền hoặc chưa xác nhận hợp đồng!', 'danger');
        } else if (!response.ok) {
          showAlert(resData.message || 'Check-in thất bại!', 'danger');
        } else {
          showAlert('✅ Check-in thành công!', 'success');
        }
      } catch (error) {
        showAlert('⚠️ Lỗi kết nối máy chủ khi Check-in.', 'danger');
      } finally {
        btnCheckIn.innerText = 'Check-in (Vào ca)';
        await loadTodayStatus();
        await loadHistory();
      }
    }

    // ==========================================
    // 5. XỬ LÝ CHECK-OUT (POST /api/attendance/check-out - Task 6.3 & 6.6)
    // ==========================================
    async function handleCheckOut() {
      const btnCheckOut = document.getElementById('btn-checkout');

      // Trạng thái Loading (Task 6.6)
      btnCheckOut.disabled = true;
      btnCheckOut.innerText = '⏳ Đang xử lý...';

      try {
        const response = await fetch(`${API_BASE}/attendance/check-out`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`
          }
        });

        const resData = await response.json();

        if (response.status === 409) {
          showAlert('⚠️ Bạn chưa check-in hoặc đã check-out rồi! (Lỗi 409)', 'warning');
        } else if (!response.ok) {
          showAlert(resData.message || 'Check-out thất bại!', 'danger');
        } else {
          showAlert('✅ Check-out thành công!', 'success');
        }
      } catch (error) {
        showAlert('⚠️ Lỗi kết nối máy chủ khi Check-out.', 'danger');
      } finally {
        btnCheckOut.innerText = 'Check-out (Tan ca)';
        await loadTodayStatus();
        await loadHistory();
      }
    }

    // ==========================================
    // 6. TẢI BẢNG LỊCH SỬ CHẤM CÔNG (GET /api/me/attendance - Task 6.4 & 6.6)
    // ==========================================
    async function loadHistory() {
      const tableBody = document.getElementById('history-table-body');

      try {
        const response = await fetch(`${API_BASE}/me/attendance`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });

        if (!response.ok) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Không thể tải lịch sử chấm công.</td></tr>`;
          return;
        }

        const resData = await response.json();
        const logs = resData.data || resData || [];

        // Trạng thái Rỗng
        if (logs.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center;">📭 Chưa có lịch sử chấm công nào.</td></tr>`;
          return;
        }

        // Đổ dữ liệu vào bảng
        tableBody.innerHTML = logs.map(item => {
          let badgeHtml = '<span class="badge badge-normal">Đúng giờ</span>';
          if (item.is_late) badgeHtml = '<span class="badge badge-late">Đi muộn</span>';
          else if (item.is_early_leave) badgeHtml = '<span class="badge badge-early">Về sớm</span>';

          return `
            <tr>
              <td>${item.work_date || item.date || 'N/A'}</td>
              <td>${item.check_in_time || '-'}</td>
              <td>${item.check_out_time || '-'}</td>
              <td>${item.worked_minutes ?? '-'}</td>
              <td>${badgeHtml}</td>
            </tr>
          `;
        }).join('');

      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Lỗi máy chủ khi tải lịch sử.</td></tr>`;
      }
    }

    // Khởi tạo trang khi load xong
    window.onload = function() {
      loadTodayStatus();
      loadHistory();
    };
  </script>
</body>
</html>
