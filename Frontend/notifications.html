<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Hệ Thống - Task 12.6</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background-color: #f4f6f9; min-height: 100vh; color: #333; }

        /* Sidebar Navigation Menu */
        .sidebar { width: 240px; background-color: #1e293b; color: white; padding: 20px 0; flex-shrink: 0; }
        .sidebar h3 { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #334155; font-size: 18px; color: #38bdf8; }
        .nav-menu { list-style: none; margin-top: 20px; }
        .nav-menu li a { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; color: #94a3b8; text-decoration: none; font-weight: 500; transition: 0.2s; }
        .nav-menu li a.active, .nav-menu li a:hover { background-color: #0f172a; color: #38bdf8; border-left: 4px solid #38bdf8; }
        
        .menu-badge { background-color: #ef4444; color: white; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: bold; }

        /* Main Content Area */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
        .header h2 { font-size: 20px; color: #1e293b; display: flex; align-items: center; gap: 8px; }

        .btn-mark-all { padding: 8px 14px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-mark-all:hover { background-color: #0369a1; }

        /* Notification List Style */
        .notif-list { list-style: none; }
        .notif-item { padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; transition: 0.2s; background-color: #ffffff; }
        .notif-item:hover { background-color: #f8fafc; border-color: #cbd5e1; }
        .notif-item.unread { background-color: #f0f9ff; border-left: 4px solid #0284c7; }

        .notif-content { flex: 1; padding-right: 15px; }
        .notif-title { font-weight: 600; font-size: 15px; color: #0f172a; margin-bottom: 4px; }
        .notif-desc { font-size: 13px; color: #475569; margin-bottom: 8px; line-height: 1.4; }
        .notif-time { font-size: 11px; color: #94a3b8; }
        
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-bottom: 6px; }
        .tag-schedule { background-color: #e0f2fe; color: #0369a1; }
        .tag-task { background-color: #fef3c7; color: #d97706; }

        /* Loading & Error States */
        .state-container { text-align: center; padding: 40px 20px; color: #64748b; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0284c7; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .error-box { background-color: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <!-- SIDEBAR MENU -->
    <div class="sidebar">
        <h3>INTERN PORTAL</h3>
        <ul class="nav-menu">
            <li><a href="index.html">Trang chủ</a></li>
            <li>
                <a href="notifications.html" class="active">
                    Thông báo
                    <span id="sidebarUnreadBadge" class="menu-badge" style="display: none;">0</span>
                </a>
            </li>
            <li><a href="work-schedules.html">Lịch thực tập</a></li>
            <li><a href="tasks.html">Nhiệm vụ</a></li>
            <li><a href="attendance.html">Chấm công</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="container">
            <div class="card">
                <div class="header">
                    <h2>🔔 Thông Báo Hệ Thống (<span id="unreadCount">0</span>)</h2>
                    <button class="btn-mark-all" onclick="markAllAsRead()">Đánh dấu đọc tất cả</button>
                </div>

                <!-- THÔNG BÁO LỖI (MẠNG / 401 / 403 / 500) -->
                <div id="errorContainer" class="error-box"></div>

                <!-- DANH SÁCH THÔNG BÁO -->
                <ul id="notifList" class="notif-list">
                    <!-- Render bằng JS -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Mock Data dùng khi chưa nối Server
        let mockNotifications = [
            { id: 101, title: 'Lịch thực tập mới', message: 'Bạn có lịch thực tập mới tuần tới. Bấm để xem chi tiết.', type: 'SCHEDULE', isRead: false, createdAt: '2026-10-12 09:00', targetUrl: 'work-schedules.html' },
            { id: 102, title: 'Nhiệm vụ mới được giao', message: 'Bạn vừa được giao Task 12.6. Vui lòng hoàn thành đúng hạn.', type: 'TASK', isRead: false, createdAt: '2026-10-12 08:30', targetUrl: 'tasks.html' },
            { id: 103, title: 'Cập nhật lịch phỏng vấn', message: 'Lịch phỏng vấn định kỳ đã được cập nhật.', type: 'SCHEDULE', isRead: true, createdAt: '2026-10-10 14:00', targetUrl: 'work-schedules.html' }
        ];

        // 1. Tải danh sách thông báo & Xử lý trạng thái Loading / Lỗi
        async function fetchNotifications() {
            const listEl = document.getElementById('notifList');
            const errorBox = document.getElementById('errorContainer');
            
            errorBox.style.display = 'none';

            if (listEl.children.length === 0) {
                listEl.innerHTML = `
                    <div class="state-container">
                        <div class="spinner"></div>
                        <p>Đang tải danh sách thông báo...</p>
                    </div>
                `;
            }

            try {
                const response = await fetch('/api/notifications', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token') || ''}` }
                });

                if (response.status === 401) {
                    throw new Error('401: Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại!');
                } else if (response.status === 403) {
                    throw new Error('403: Bạn không có quyền truy cập thông báo này!');
                } else if (response.status >= 500) {
                    throw new Error('500: Lỗi máy chủ nội bộ. Vui lòng thử lại sau!');
                } else if (!response.ok) {
                    throw new Error('Lỗi tải thông báo từ máy chủ!');
                }

                const data = await response.json();
                renderNotifications(data.items);
                updateUnreadCount(data.unreadCount);

            } catch (error) {
                console.warn("API Call Failed, fallbacking to Mock Data:", error.message);

                if (error.message.includes('401') || error.message.includes('403') || error.message.includes('500')) {
                    showError(error.message);
                } else if (!navigator.onLine) {
                    showError("Lỗi kết nối mạng! Vui lòng kiểm tra lại đường truyền Internet.");
                } else {
                    // Fallback Mock Data
                    renderNotifications(mockNotifications);
                    const unread = mockNotifications.filter(n => !n.isRead).length;
                    updateUnreadCount(unread);
                }
            }
        }

        // 2. Định kỳ cập nhật số lượng chưa đọc (Polling 30s)
        async function fetchUnreadCountOnly() {
            try {
                const response = await fetch('/api/notifications/unread-count', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token') || ''}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    updateUnreadCount(data.unreadCount);
                }
            } catch (e) {
                // Giữ số lượng chưa đọc hiện tại từ mock khi không có mạng
                const unread = mockNotifications.filter(n => !n.isRead).length;
                updateUnreadCount(unread);
            }
        }

        function updateUnreadCount(count) {
            document.getElementById('unreadCount').innerText = count;
            const sidebarBadge = document.getElementById('sidebarUnreadBadge');
            
            if (count > 0) {
                sidebarBadge.innerText = count;
                sidebarBadge.style.display = 'inline-block';
            } else {
                sidebarBadge.style.display = 'none';
            }
        }

        function renderNotifications(items) {
            const listEl = document.getElementById('notifList');

            if (!items || items.length === 0) {
                listEl.innerHTML = `
                    <div class="state-container">
                        🔕 Không có thông báo nào.
                    </div>
                `;
                return;
            }

            listEl.innerHTML = items.map(item => {
                const tagClass = item.type === 'SCHEDULE' ? 'tag-schedule' : 'tag-task';
                const tagText = item.type === 'SCHEDULE' ? 'Lịch thực tập' : 'Nhiệm vụ';

                return `
                    <li class="notif-item ${item.isRead ? '' : 'unread'}" onclick="handleNotifClick(${item.id}, '${item.targetUrl}')">
                        <div class="notif-content">
                            <span class="tag ${tagClass}">${tagText}</span>
                            <div class="notif-title">${item.title}</div>
                            <div class="notif-desc">${item.message}</div>
                            <div class="notif-time">⏱ ${item.createdAt}</div>
                        </div>
                    </li>
                `;
            }).join('');
        }

        // 3. Đánh dấu đã đọc & Chuyển sang tab Lịch thực tập / Nhiệm vụ
        async function handleNotifClick(id, targetUrl) {
            try {
                await fetch(`/api/notifications/${id}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token') || ''}` }
                });
            } catch (e) {
                // Fallback mock
                const target = mockNotifications.find(n => n.id === id);
                if (target) target.isRead = true;
            }

            window.location.href = targetUrl;
        }

        // 4. Đánh dấu tất cả là đã đọc
        async function markAllAsRead() {
            try {
                await fetch('/api/notifications/read-all', {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token') || ''}` }
                });
            } catch (e) {
                mockNotifications.forEach(n => n.isRead = true);
            }
            fetchNotifications();
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorContainer');
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
        }

        window.onload = () => {
            fetchNotifications();

            // Thiết lập polling cập nhật định kỳ mỗi 30 giây (30-60 giây theo yêu cầu)
            setInterval(() => {
                fetchUnreadCountOnly();
            }, 30000);
        };
    </script>
</body>
</html>
