<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 8.5 - Nối API Thiết Lập Lịch HR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { color: #2c3e50; margin-bottom: 15px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
    select, input[type="text"], input[type="time"], input[type="number"] { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; }
    .btn { padding: 9px 16px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-success { background-color: #28a745; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-warning { background-color: #ffc107; color: #212529; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    
    /* Báo lỗi API (Task 8.5) */
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 15px; display: none; font-size: 14px; }
    .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

    .form-container { background: #eef2f7; padding: 20px; border-radius: 6px; margin-bottom: 20px; display: none; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 13px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e9ecef; }
    th { background-color: #f8f9fa; color: #495057; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #e9ecef; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>📅 Task 8.5: Nối API Thiết Lập Lịch Làm Việc (HR)</h2>

      <!-- Báo lỗi API / Quyền hạn -->
      <div id="alert-message" class="alert"></div>

      <div class="toolbar">
        <div>
          <label><b>Lọc theo nhóm:</b></label>
          <select id="group-filter" onchange="filterSchedules()">
            <option value="ALL">-- Tất cả các nhóm --</option>
            <option value="Dev">Nhóm Dev</option>
            <option value="Tester">Nhóm Tester</option>
            <option value="Marketing">Nhóm Marketing</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="showCreateForm()">➕ Thêm Lịch Mới</button>
      </div>

      <!-- Form tạo / sửa -->
      <div id="schedule-form-container" class="form-container">
        <h3 id="form-title" style="margin-bottom: 15px; color: #007bff;">Tạo Lịch Làm Việc Mới</h3>
        <form onsubmit="handleSaveSchedule(event)">
          <input type="hidden" id="schedule-id">
          <div class="form-grid">
            <div class="form-group">
              <label>Tên Nhóm *</label>
              <select id="group-name" required>
                <option value="Dev">Nhóm Dev</option>
                <option value="Tester">Nhóm Tester</option>
                <option value="Marketing">Nhóm Marketing</option>
              </select>
            </div>
            <div class="form-group">
              <label>Ngày Trong Tuần *</label>
              <select id="day-of-week" required>
                <option value="2">Thứ 2</option>
                <option value="3">Thứ 3</option>
                <option value="4">Thứ 4</option>
                <option value="5">Thứ 5</option>
                <option value="6">Thứ 6</option>
              </select>
            </div>
            <div class="form-group">
              <label>Giờ Vào *</label>
              <input type="time" id="start-time" required>
            </div>
            <div class="form-group">
              <label>Giờ Ra *</label>
              <input type="time" id="end-time" required>
            </div>
            <div class="form-group">
              <label>Du Di (Phút)</label>
              <input type="number" id="grace-period" value="15">
            </div>
          </div>
          <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" class="btn btn-secondary" onclick="hideForm()">Hủy</button>
            <button type="submit" id="btn-submit" class="btn btn-success">💾 Lưu Vào Server</button>
          </div>
        </form>
      </div>

      <!-- Bảng danh sách -->
      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Nhóm</th>
            <th>Thứ / Ngày</th>
            <th>Giờ Vào</th>
            <th>Giờ Ra</th>
            <th>Du Di</th>
            <th>Thao Tác</th>
          </tr>
        </thead>
        <tbody id="schedule-table-body">
          <tr><td colspan="7" style="text-align: center;">⏳ Đang tải lịch...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = '/api/schedules';
    const getToken = () => localStorage.getItem('token') || '';
    let allSchedules = [];

    function showAlert(msg, type = 'danger') {
      const box = document.getElementById('alert-message');
      box.className = `alert alert-${type}`;
      box.innerText = msg;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 5000);
    }

    // GET API - Tải dữ liệu từ server (Task 8.5)
    async function loadSchedules() {
      const tbody = document.getElementById('schedule-table-body');
      try {
        const res = await fetch(API_URL, { headers: { 'Authorization': `Bearer ${getToken()}` } });
        
        if (res.status === 401) return showAlert('🔒 Phiên đăng nhập hết hạn (401)', 'danger');
        if (res.status === 403) return showAlert('🚫 Bạn không có quyền HR (403)', 'warning');
        if (!res.ok) return showAlert('Lỗi không thể tải danh sách lịch.', 'danger');

        const data = await res.json();
        allSchedules = data.data || data || [];
        renderTable(allSchedules);
      } catch (err) {
        showAlert('⚠️ Không thể kết nối Server (Lỗi 500)', 'danger');
      }
    }

    function renderTable(schedules) {
      const tbody = document.getElementById('schedule-table-body');
      if (!schedules.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center;">📭 Chưa có lịch nào.</td></tr>`;
        return;
      }
      const dayNames = { '2': 'Thứ 2', '3': 'Thứ 3', '4': 'Thứ 4', '5': 'Thứ 5', '6': 'Thứ 6' };
      tbody.innerHTML = schedules.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><b>${item.group_name || item.group}</b></td>
          <td><span class="badge">${dayNames[item.day_of_week] || item.day_of_week}</span></td>
          <td>${item.start_time}</td>
          <td>${item.end_time}</td>
          <td>${item.grace_period || 0} phút</td>
          <td>
            <button class="btn btn-warning btn-sm" onclick="editSchedule(${item.id})">✏️ Sửa</button>
            <button class="btn btn-danger btn-sm" onclick="deleteSchedule(${item.id})">🗑️ Xóa</button>
          </td>
        </tr>
      `).join('');
    }

    function filterSchedules() {
      const val = document.getElementById('group-filter').value;
      if (val === 'ALL') renderTable(allSchedules);
      else renderTable(allSchedules.filter(s => (s.group_name || s.group) === val));
    }

    function showCreateForm() {
      document.getElementById('schedule-id').value = '';
      document.getElementById('form-title').innerText = 'Tạo Lịch Làm Việc Mới';
      document.getElementById('schedule-form-container').style.display = 'block';
    }

    function hideForm() {
      document.getElementById('schedule-form-container').style.display = 'none';
    }

    function editSchedule(id) {
      const item = allSchedules.find(s => s.id === id);
      if (!item) return;
      document.getElementById('schedule-id').value = item.id;
      document.getElementById('group-name').value = item.group_name || item.group;
      document.getElementById('day-of-week').value = item.day_of_week;
      document.getElementById('start-time').value = item.start_time;
      document.getElementById('end-time').value = item.end_time;
      document.getElementById('grace-period').value = item.grace_period;
      document.getElementById('schedule-form-container').style.display = 'block';
    }

    // POST / PUT API - Lưu lịch (Task 8.5)
    async function handleSaveSchedule(e) {
      e.preventDefault();
      const id = document.getElementById('schedule-id').value;
      const start_time = document.getElementById('start-time').value;
      const end_time = document.getElementById('end-time').value;

      // Kiểm tra Giờ sai (Check-in >= Check-out - Task 8.5)
      if (start_time >= end_time) {
        return showAlert('⚠️ Giờ vào phải sớm hơn giờ ra!', 'warning');
      }

      const payload = {
        group_name: document.getElementById('group-name').value,
        day_of_week: document.getElementById('day-of-week').value,
        start_time, end_time,
        grace_period: parseInt(document.getElementById('grace-period').value) || 0
      };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
          body: JSON.stringify(payload)
        });

        const resData = await res.json();
        if (res.status === 409) return showAlert('⚠️ Lịch bị trùng giờ!', 'warning');
        if (!res.ok) return showAlert(resData.message || 'Lưu lịch thất bại', 'danger');

        showAlert('✅ Lưu lịch thành công!', 'success');
        hideForm();
        loadSchedules();
      } catch (err) {
        showAlert('⚠️ Lỗi kết nối Server.', 'danger');
      }
    }

    // DELETE API - Xóa lịch (Task 8.5)
    async function deleteSchedule(id) {
      if (!confirm('Bạn có muốn xóa lịch làm việc này?')) return;
      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (!res.ok) return showAlert('Xóa thất bại', 'danger');
        showAlert('✅ Đã xóa lịch làm việc', 'success');
        loadSchedules();
      } catch (err) {
        showAlert('Lỗi kết nối khi xóa', 'danger');
      }
    }

    window.onload = loadSchedules;
  </script>
</body>
</html>
