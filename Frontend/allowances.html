
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý phụ cấp</title>
    <link rel="stylesheet" href="allowances.css">
</head>
<body>
    <aside class="sidebar">
        <h2>HR Management</h2>
        <a href="index.html">Trang chủ</a>
        <a href="allowances.html" class="active">Quản lý phụ cấp</a>
    </aside>

    <main class="content">
        <h1>Quản lý phụ cấp thực tập sinh</h1>

        <section class="panel">
            <h2>Thêm phụ cấp</h2>

            <form id="allowanceForm">
                <label for="intern">Thực tập sinh</label>
                <input id="intern" name="intern"
                       placeholder="Nhập tên thực tập sinh" required>

                <label for="type">Loại phụ cấp</label>
                <select id="type" name="type" required>
                    <option value="">-- Chọn loại --</option>
                    <option value="Ăn trưa">Ăn trưa</option>
                    <option value="Đi lại">Đi lại</option>
                    <option value="Điện thoại">Điện thoại</option>
                    <option value="Khác">Khác</option>
                </select>

                <label for="amount">Số tiền (VND)</label>
                <input id="amount" name="amount"
                       type="number" min="1" step="1" required>

                <label for="period">Kỳ phụ cấp</label>
                <select id="period" name="period" required>
                    <option value="">-- Chọn kỳ --</option>
                    <option value="Tháng">Theo tháng</option>
                    <option value="Tuần">Theo tuần</option>
                    <option value="Một lần">Một lần</option>
                </select>

                <label for="note">Ghi chú</label>
                <textarea id="note" name="note"></textarea>

                <button type="submit">Thêm phụ cấp</button>
                <p id="message" role="status"></p>
            </form>
            <div class="panel">
  <h2>Danh sách phụ cấp</h2>

  <label for="filterIntern">Lọc thực tập sinh:</label>
  <input id="filterIntern" type="text" placeholder="Nhập tên thực tập sinh">

  <label for="filterPeriod">Lọc theo kỳ:</label>
  <select id="filterPeriod">
    <option value="">Tất cả</option>
    <option value="Tháng">Theo tháng</option>
    <option value="Tuần">Theo tuần</option>
    <option value="Một lần">Một lần</option>
  </select>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Thực tập sinh</th>
          <th>Loại phụ cấp</th>
          <th>Số tiền (VND)</th>
          <th>Kỳ</th>
          <th>Ghi chú</th>
          <th>Người nhập</th>
          <th>Ngày nhập</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="allowanceList"></tbody>
    </table>
  </div>
  <p id="formMessage" role="status"></p>
</div>
        </section>

        <section class="panel">
            <h2>Danh sách phụ cấp</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Thực tập sinh</th>
                            <th>Loại phụ cấp</th>
                            <th>Số tiền</th>
                            <th>Kỳ</th>
                            <th>Ghi chú</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="allowanceList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/mockData.js"></script>
    <script src="allowances.js"></script>
</body>
</html>
