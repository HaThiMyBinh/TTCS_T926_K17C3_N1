<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cổng Đăng Ký Ứng Tuyển Thực Tập Sinh</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #2259f0;
        --primary-hover: #1a54e7;
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0;
        --slate-300: #cbd5e1;
        --slate-600: #475569;
        --slate-700: #334155;
        --slate-900: #0f172a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Roboto", sans-serif;
      }

      body {
        background: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 16px;
      }

      .container {
        width: 100%;
        max-width: 580px;
        background: white;
        border: 1px solid var(--slate-200);
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        overflow: hidden;
      }

      .header-banner {
        background: var(--primary);
        padding: 32px 30px;
        color: white;
        text-align: center;
        position: relative;
      }

      .header-banner .icon-badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin: 0 auto 14px;
      }

      .header-banner h2 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }

      .header-banner p {
        font-size: 13px;
        opacity: 0.9;
        margin-top: 6px;
      }

      .form-wrapper {
        padding: 32px 30px;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13.5px;
        margin-bottom: 20px;
        display: none;
        align-items: center;
        gap: 10px;
        font-weight: 500;
      }

      .alert-success {
        background-color: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }

      .alert-error {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      @media (max-width: 540px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }

      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--slate-700);
        margin-bottom: 6px;
      }

      .input-icon-wrap {
        position: relative;
      }

      .input-icon-wrap i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 11px 12px 11px 38px;
        border: 1px solid var(--slate-300);
        border-radius: 8px;
        font-size: 13.5px;
        color: var(--slate-900);
        outline: none;
        transition: all 0.2s;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      .btn-submit {
        width: 100%;
        padding: 13px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s;
        margin-top: 10px;
      }

      .btn-submit:hover {
        background: var(--primary-hover);
      }

      .btn-submit:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- BANNER -->
      <div class="header-banner">
        <div class="icon-badge">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>Đăng Ký Thực Tập Sinh Trực Tuyến</h2>
        <p>Cổng tiếp nhận hồ sơ ứng tuyển chương trình thực tập doanh nghiệp</p>
      </div>

      <!-- FORM NỘP HỒ SƠ -->
      <div class="form-wrapper">
        <div id="alertMsg" class="alert"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Họ và tên sinh viên *</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                id="regName"
                placeholder="Nhập họ và tên đầy đủ"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email liên hệ *</label>
              <div class="input-icon-wrap">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="regEmail" required />
              </div>
            </div>
            <div class="form-group">
              <label>Số điện thoại *</label>
              <div class="input-icon-wrap">
                <i class="fa-solid fa-phone"></i>
                <input
                  type="tel"
                  id="regPhone"
                  placeholder="0xxxxxxxxx"
                  required
                />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Mật khẩu đăng nhập tài khoản *</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="regPassword"
                placeholder="Tối thiểu 6 ký tự"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Trường Đại Học / Cao Đẳng *</label>
              <div class="input-icon-wrap">
                <i class="fa-solid fa-building-columns"></i>
                <input type="text" id="regUniversity" required />
              </div>
            </div>
            <div class="form-group">
              <label>Chuyên ngành đào tạo</label>
              <div class="input-icon-wrap">
                <i class="fa-solid fa-laptop-code"></i>
                <input type="text" id="regMajor" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Đường link CV / Portfolio (Google Drive / Github)</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-link"></i>
              <input type="url" id="regCvLink" />
            </div>
          </div>

          <button type="submit" id="btnSubmit" class="btn-submit">
            <i class="fa-solid fa-paper-plane"></i> Nộp Hồ Sơ Ứng Tuyển
          </button>
        </form>
      </div>
    </div>

    <script>
      const API_URL = "/api/auth/register";

      async function handleRegister(e) {
        e.preventDefault();

        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const phone = document.getElementById("regPhone").value.trim();
        const password = document.getElementById("regPassword").value;
        const university = document
          .getElementById("regUniversity")
          .value.trim();
        const major = document.getElementById("regMajor").value.trim();
        const cvLink = document.getElementById("regCvLink").value.trim();

        const alertEl = document.getElementById("alertMsg");
        const btn = document.getElementById("btnSubmit");

        // Validate cơ bản
        if (password.length < 6) {
          showMsg(" Mật khẩu phải có từ 6 ký tự trở lên!", "error");
          return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang nộp hồ sơ...`;

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              email,
              password,
              phone,
              university,
              major,
              cvLink,
            }),
          });
          const data = await res.json();

          if (res.ok) {
            showMsg(data.message, "success");
            document.getElementById("registerForm").reset();
          } else {
            showMsg(data.error || "Nộp hồ sơ thất bại!", "error");
          }
        } catch (err) {
          showMsg(
            " Không thể kết nối tới máy chủ! (Vui lòng kiểm tra server.js)",
            "error",
          );
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Nộp Hồ Sơ Ứng Tuyển`;
        }
      }

      function showMsg(msg, type) {
        const alertEl = document.getElementById("alertMsg");
        alertEl.className = `alert alert-${type}`;
        alertEl.textContent = msg;
        alertEl.style.display = "flex";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
  </body>
</html>
