<!-- register.html -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng Ký Ứng Tuyển Thực Tập Sinh</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 30px 15px;
        box-sizing: border-box;
      }
      .card {
        background: white;
        padding: 35px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 480px;
        box-sizing: border-box;
      }
      h2 {
        text-align: center;
        color: #1a365d;
        margin-top: 0;
        margin-bottom: 6px;
      }
      p.desc {
        text-align: center;
        color: #718096;
        font-size: 13px;
        margin-bottom: 22px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        font-size: 13px;
        color: #4a5568;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: #3182ce;
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #2b6cb0;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #2c5282;
      }
      button:disabled {
        background-color: #a0aec0;
      }
      .alert {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 18px;
        font-size: 14px;
        display: none;
      }
      .alert-success {
        background-color: #c6f6d5;
        color: #22543d;
        border: 1px solid #9ae6b4;
      }
      .alert-error {
        background-color: #fed7d7;
        color: #742a2a;
        border: 1px solid #feb2b2;
      }
    </style>
  </head>
  <body>
    <!-- FORM ĐĂNG KÝ HỒ SƠ ỨNG TUYỂN CÔNG KHAI -->
    <div class="card">
      <h2>Đăng Ký Thực Tập Sinh</h2>
      <p class="desc">Điền đầy đủ thông tin bên dưới để nộp hồ sơ trực tuyến</p>

      <!-- THÔNG BÁO KẾT QUẢ -->
      <div id="msgBox" class="alert"></div>

      <form id="applyForm">
        <div class="form-group">
          <label>Họ và tên *</label>
          <input
            type="text"
            id="name"
            placeholder="Ví dụ: Nguyễn Văn An"
            required
          />
        </div>

        <div class="form-group">
          <label>Email liên hệ *</label>
          <input
            type="email"
            id="email"
            placeholder="an.nguyen@gmail.com"
            required
          />
        </div>

        <div class="form-group">
          <label>Mật khẩu tạo tài khoản *</label>
          <input
            type="password"
            id="password"
            placeholder="Tối thiểu 6 ký tự"
            required
          />
        </div>

        <div class="form-group">
          <label>Số điện thoại *</label>
          <input type="tel" id="phone" placeholder="0912345678" required />
        </div>

        <div class="form-group">
          <label>Trường Đại học / Cao đẳng *</label>
          <input
            type="text"
            id="university"
            placeholder="Ví dụ: ĐH CNTT & Truyền Thông (ICTU)"
            required
          />
        </div>

        <div class="form-group">
          <label>Chuyên ngành học</label>
          <input
            type="text"
            id="major"
            placeholder="Ví dụ: Kỹ thuật phần mềm"
          />
        </div>

        <div class="form-group">
          <label>Link CV / Portfolio </label>
          <input
            type="url"
            id="cvLink"
            placeholder="https://drive.google.com/..."
          />
        </div>

        <button type="submit" id="btnSubmit">Nộp Hồ Sơ Ứng Tuyển</button>
      </form>
    </div>

    <script>
      // TÍCH HỢP GỌI API ĐĂNG KÝ
      document
        .getElementById("applyForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const phone = document.getElementById("phone").value.trim();
          const university = document.getElementById("university").value.trim();
          const major = document.getElementById("major").value.trim();
          const cvLink = document.getElementById("cvLink").value.trim();

          const btn = document.getElementById("btnSubmit");
          const msgBox = document.getElementById("msgBox");

          // Validate cơ bản phía client
          if (password.length < 6) {
            showMsg(" Mật khẩu phải có độ dài từ 6 ký tự trở lên!", "error");
            return;
          }

          btn.disabled = true;
          btn.innerText = "Đang nộp hồ sơ...";
          msgBox.style.display = "none";

          try {
            const res = await fetch("http://127.0.0.1:5000/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name,
                email,
                password,
                phone,
                university,
                major,
                cvLink,
              }),
            });

            const data = await res.json();

            if (res.ok) {
              showMsg(" " + data.message, "success");
              document.getElementById("applyForm").reset();
            } else {
              showMsg(
                " [FAIL] " + (data.error || "Nộp hồ sơ thất bại!"),
                "error",
              );
            }
          } catch (err) {
            showMsg(
              " [FAIL] Không thể kết nối tới Backend! (Vui lòng kiểm tra server.js)",
              "error",
            );
          } finally {
            btn.disabled = false;
            btn.innerText = " Nộp Hồ Sơ Ứng Tuyển";
          }
        });

      function showMsg(message, type) {
        const msgBox = document.getElementById("msgBox");
        msgBox.className = `alert alert-${type}`;
        msgBox.innerText = message;
        msgBox.style.display = "block";
      }
    </script>
  </body>
</html>
